<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="theme-color" content="#0a1628" />
    <title>Hopper — Platformer</title>
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #0a1628;
        font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
        /* Stop pull-to-refresh / overscroll on mobile browsers */
        overscroll-behavior: none;
        touch-action: none;
        -webkit-text-size-adjust: 100%;
      }

      #app {
        position: relative;
        width: 100%;
        height: 100%;
        /* Fill notch / home-indicator safe areas */
        min-height: 100dvh;
        touch-action: none;
      }

      canvas {
        display: block;
        width: 100%;
        height: 100%;
        touch-action: none;
      }

      /* Light CSS vignette (shader pass does the heavy lifting) */
      #vignette {
        pointer-events: none;
        position: absolute;
        inset: 0;
        z-index: 10;
        background: radial-gradient(
          ellipse at center,
          transparent 58%,
          rgba(5, 12, 28, 0.28) 100%
        );
      }
    </style>
  </head>
  <body>
    <div id="app">
      <div id="vignette"></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
